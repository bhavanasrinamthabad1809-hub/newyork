<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Future New Yorker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">

        <div class="hero-image">


            <img src="images/nyc.jpg" alt="New York City">

        </div>


        <div class="hero-text">

            <h1>NEW YORK CITY</h1>

            <p>FUTURE NEW YORKER</p>

        </div>

    </section>




    <section class="places">

        <h2>PLACES TO VISIT</h2>


        <div class="places-grid">

            <div class="place">

                <img
                    src="images/nyc photo inspo.jpg"
                    alt="Statue of Liberty"
                >

                <h3>Statue of Liberty</h3>

            </div>


            <div class="place">

                <img
                    src="images/central park.jpg"
                    alt="Central Park"
                >

                <h3>Central Park</h3>

            </div>


            <div class="place">


                <img
                    src="images/Brooklyn nyc.jpg"
                    alt="Brooklyn Bridge"
                >

                <h3>Brooklyn Bridge</h3>

            </div>




            <div class="place">


                <img
                    src="images/time squares.jpg"
                    alt="Times Square"
                >

                <h3>Times Square</h3>

            </div>



            <div class="place">


                <img
                    src="images/empire.jpg"
                    alt="Empire State Building"
                >

                <h3>Empire State Building</h3>

            </div>


        </div>

    </section>




    <section class="gallery">

        <h2>THINGS I AM GONNA DO</h2>


        <div class="photo-grid">

            <div class="photo photo-large">


                <img src="images/diva.jpg" alt="New York">

            </div>


            <div class="photo">


                <img src="images/code in nyc.jpg" alt="New York">

            </div>





            <div class="photo">

                <img src="images/newcool.jpg" alt="New York">

            </div>


        </div>

    </section>



    <footer>

        <p> FUTURE NEWYORKER  WITH LOTS OF LOVE</p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
